# CALVIN ABC→D evaluation for X-VLA LoRA 260424
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/calvin:latest
  env:
    - "NVIDIA_DRIVER_CAPABILITIES=all"

output_dir: "./results/xvla_calvin_lora_260424_eval"

benchmarks:
  - benchmark: "vla_eval.benchmarks.calvin.benchmark:CALVINBenchmark"
    mode: sync
    episodes_per_task: 1
    params:
      dataset_path: "/data/calvin/dataset/validation"
      num_sequences: 1000
      seed: 0
