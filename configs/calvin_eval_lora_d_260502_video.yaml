# CALVIN ABC->D evaluation for X-VLA LoRA d 260502 with rollout videos.
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/calvin:latest
  env:
    - "NVIDIA_DRIVER_CAPABILITIES=all"

output_dir: "./results/xvla_calvin_lora_d_260502_eval"

benchmarks:
  - benchmark: "vla_eval.benchmarks.calvin.benchmark:CALVINBenchmark"
    mode: sync
    episodes_per_task: 1
    save_rollout_video: true
    save_rollout_trajectory: false
    rollout_video_fps: 10
    params:
      dataset_path: "/data/calvin/dataset/validation"
      num_sequences: 1000
      seed: 0
